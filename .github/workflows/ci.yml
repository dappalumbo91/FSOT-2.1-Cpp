name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update -q && sudo apt-get install -y -q libboost-dev nlohmann-json3-dev ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test (golden at every type, trit, balanced-ternary engine, freestanding symbols)
        run: ctest --test-dir build --output-on-failure
  build-test-msvc:
    # Native Windows / MSVC (windows-latest, free for public repos). Blocking since its first green run
    # (CI 37075909187 on c7b58e1, /utf-8 fix; recorded as H-35 in docs/AUDIT_LOG.md).
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install Boost.Multiprecision, Boost.Math, nlohmann-json (vcpkg)
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost-multiprecision boost-math nlohmann-json --triplet x64-windows'
      - name: Configure (MSVC, Visual Studio generator)
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build --config Release
      - name: Test (precision report must be byte-identical to the Linux golden)
        run: ctest --test-dir build -C Release --output-on-failure
  regen-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mpmath
        run: pip install mpmath==1.4.1
      - name: Fetch pinned authority (commit + SHA-256 check)
        run: python tools/fetch_authority.py --out authority/fsot_compute.py
      - name: Regenerate closed forms and golden values
        run: |
          python tools/gen_closed_forms.py --authority authority/fsot_compute.py
          python tools/dump_golden.py --authority authority/fsot_compute.py
      - name: Generated files must match the committed ones
        run: git diff --exit-code -- include/fsot/closed_forms.gen.inc include/fsot/closed_forms_core.gen.inc golden/golden_AEB2AD.tsv
  ledger-b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # freezes/*.json are dated by their first commit in this repo (gen_tier_evidence.py)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libboost-dev nlohmann-json3-dev ninja-build
          pip install mpmath==1.4.1
      - name: Sparse-clone hub data at the pinned commit
        run: |
          COMMIT=$(python -c "import json;print(json.load(open('AUTHORITY_PIN.json'))['ledger_b_data_commit'])")
          git clone -q --filter=blob:none --no-checkout https://github.com/dappalumbo91/FSOT-2.1-Lean hub
          cd hub
          git sparse-checkout set --no-cone '/data/*_benchmark.json' '/data/literature_uncertainty_anchors.json' '/data/stumped_observables_reference.json' '/data/extension_folds_derived.json' '/data/domain_table_freeze.json' '/predictions/' '/scripts/' '/vendor/fsot_compute.py' '/vendor/fsot_seed_flavor.py' '/vendor/fsot_aggregate/FSOT_Mathematical_Database_Unified.json'
          git checkout -q "$COMMIT"
      - name: Regenerate the Ledger B golden with the hub's own Python and diff
        run: |
          python tools/dump_ledger_b_golden.py --hub hub --out /tmp/ledger_b.tsv
          diff -q /tmp/ledger_b.tsv golden/ledger_b_6f9c2560.tsv
      - name: Regenerate Ledger A / routing tables and golden from the hub's Python and diff
        run: |
          python tools/gen_ledger_a_routing.py --hub hub
          python tools/dump_ledger_a_routing_golden.py --hub hub --out /tmp/ledger_a_routing.tsv
          git diff --exit-code -- include/fsot/ledger_a.gen.inc include/fsot/routing.gen.inc
          diff -q /tmp/ledger_a_routing.tsv golden/ledger_a_routing.tsv
      - name: Regenerate the dated tier evidence from hub git history and diff
        run: |
          python tools/gen_tier_evidence.py --hub hub
          git diff --exit-code -- golden/tier_evidence_6f9c2560.json
      - name: Regenerate the seed-leaf golden (hub scripts/*_seed_check.py run unchanged) and the pin lineage, and diff
        run: |
          python tools/dump_seed_leaves_golden.py --hub hub --out /tmp/seed_leaves.tsv
          diff -q /tmp/seed_leaves.tsv golden/seed_leaves_6f9c2560.tsv
          python tools/pin_lineage.py --hub hub --out /tmp/pin_lineage.tsv
          diff -q /tmp/pin_lineage.tsv reference/pin_lineage_2026-10-02.tsv
      - name: Re-score the 2026-10-02b freeze with the hub engine (candidates, look-elsewhere family, held-out, Ledger B) and diff
        run: |
          python tools/score_refinements_2026_10_02b.py --hub hub --out /tmp/refinements_b.tsv
          diff -q /tmp/refinements_b.tsv audit/refinements_2026-10-02b.tsv
          python tools/verify_refinement_freeze_b.py
          python tools/crosscheck_refinements_b.py
      - name: Re-run the 2026-10-02c train/test search (training, then scoring) with the hub engine and diff
        run: |
          python tools/train_2026_10_02c.py --hub hub --out /tmp/train_c.tsv
          diff -q /tmp/train_c.tsv audit/train_2026-10-02c.tsv
          python tools/score_2026_10_02c.py --hub hub --out /tmp/score_c.tsv
          diff -q /tmp/score_c.tsv audit/score_2026-10-02c.tsv
          python tools/verify_freeze_files_c.py
      - name: Re-run the 2026-10-02d derivations (rows + training, then scoring) with the hub engine and diff
        run: |
          python tools/train_2026_10_02d.py --hub hub --rows-out /tmp/rows_d.tsv --out /tmp/train_d.tsv
          diff -q /tmp/rows_d.tsv audit/rows_2026-10-02d.tsv
          diff -q /tmp/train_d.tsv audit/train_2026-10-02d.tsv
          python tools/score_2026_10_02d.py --hub hub --out /tmp/score_d.tsv
          diff -q /tmp/score_d.tsv audit/score_2026-10-02d.tsv
          python tools/verify_freeze_files_d.py
      - name: Re-run the 2026-10-02e scoring (v/G_F fix, alpha_s(m_tau), BR) with the hub engine and diff
        run: |
          python tools/score_2026_10_02e.py --hub hub --out /tmp/score_e.tsv
          diff -q /tmp/score_e.tsv audit/score_2026-10-02e.tsv
          python tools/verify_freeze_files_e.py
      - name: Re-run the 2026-10-02f scoring (Delta r, alpha(M_Z), G_F H1/H2) with the hub engine and diff
        run: |
          python tools/score_2026_10_02f.py --hub hub --out /tmp/score_f.tsv
          diff -q /tmp/score_f.tsv audit/score_2026-10-02f.tsv
          python tools/verify_freeze_files_f.py
      - name: Re-run the 2026-10-02g scoring (effective Z couplings, LEPTOP; validation + H1/H2/H2c) with the hub engine and diff
        run: |
          python tools/score_2026_10_02g.py --hub hub --out /tmp/score_g.tsv
          diff -q /tmp/score_g.tsv audit/score_2026-10-02g.tsv
          python tools/verify_freeze_files_g.py
      - name: Re-run the 2026-10-02h trace tables and branch scoring (GZ-1, DM-R1, T-1, MUD-1) with the hub engine and diff
        run: |
          python tools/trace_2026_10_02h.py --hub hub --out /tmp/trace_h.tsv
          diff -q /tmp/trace_h.tsv audit/trace_2026-10-02h.tsv
          python tools/score_2026_10_02h.py --hub hub --out /tmp/score_h.tsv
          diff -q /tmp/score_h.tsv audit/score_2026-10-02h.tsv
          python tools/verify_freeze_files_h.py
      - name: Re-run the 2026-10-02i branch scoring (HAD-1, HAD-2, GZ-1 H1-i) with the hub engine and diff; verify freeze i and owner decisions
        run: |
          python tools/score_2026_10_02i.py --hub hub --out /tmp/score_i.tsv
          diff -q /tmp/score_i.tsv audit/score_2026-10-02i.tsv
          python tools/verify_freeze_files_i.py
          head -1 audit/OWNER_DECISIONS_2026-10-02i.sha256 | sha256sum -c -
      - name: Re-run the 2026-10-02j trace tables and strong-sector branch scoring (J-1..J-5) with the hub engine and diff; verify freeze j
        run: |
          python tools/trace_2026_10_02j.py --hub hub --out /tmp/trace_j.tsv
          diff -q /tmp/trace_j.tsv audit/trace_2026-10-02j.tsv
          python tools/score_2026_10_02j.py --hub hub --out /tmp/score_j.tsv
          diff -q /tmp/score_j.tsv audit/score_2026-10-02j.tsv
          python tools/verify_freeze_files_j.py
      - name: Re-run the 2026-10-02k trace tables (theta_S, unit audit, m_s/m_ud, cosmology) and branch scoring (K-1..K-5, D-1) and diff; verify freeze k
        run: |
          python tools/trace_2026_10_02k.py --hub hub --out /tmp/trace_k.tsv
          diff -q /tmp/trace_k.tsv audit/trace_2026-10-02k.tsv
          python tools/score_2026_10_02k.py --hub hub --out /tmp/score_k.tsv
          diff -q /tmp/score_k.tsv audit/score_2026-10-02k.tsv
          python tools/verify_freeze_files_k.py
      - name: Re-run the 2026-10-02l scoring (L-A1 octet with held-out pi0/K0/eta, L-B1 GMOR quark masses, L-C1 r_p) and restatement table and diff; verify freeze l
        run: |
          python tools/score_2026_10_02l.py --hub hub --out /tmp/score_l.tsv
          diff -q /tmp/score_l.tsv audit/score_2026-10-02l.tsv
          git diff --exit-code audit/derive_2026-10-02l.tsv
          python tools/verify_freeze_files_l.py
      - name: Re-run the 2026-10-02m scoring (M-1 ratio organization, M-2 DGMLY pi0 / Q-route K0 / U(3) eta-eta', M-3 quark-level sigma-model F) and diff; verify freeze m
        run: |
          python tools/score_2026_10_02m.py --hub hub --out /tmp/score_m.tsv
          diff -q /tmp/score_m.tsv audit/score_2026-10-02m.tsv
          python tools/verify_freeze_files_m.py
      - name: Re-run the 2026-10-02n scoring (N-1 F_pi NLO, N-2 valence chiral quark soliton g_A, N-3 deuteron LO, N-5 reference-leaf D_eff maps) and diff; verify freeze n
        run: |
          python tools/score_2026_10_02n.py --hub hub --out /tmp/score_n.tsv
          diff -q /tmp/score_n.tsv audit/score_2026-10-02n.tsv
          python tools/verify_freeze_files_n.py
      - name: Re-run the 2026-10-02o scoring (O-1 full-sea chiral quark soliton g_A and Delta-N, O-3 deuteron OPE, O-3b mu_n/mu_d, O-4 lbar4, O-6 E_h) and diff; verify freeze o
        run: |
          python tools/score_2026_10_02o.py --hub hub --out /tmp/score_o.tsv
          diff -q /tmp/score_o.tsv audit/score_2026-10-02o.tsv
          python tools/verify_freeze_files_o.py
      - name: Re-run the 2026-10-02p scoring (P-1 soliton g_A^(1) and Delta-N, P-2 soliton magnetic moments and mu_d, P-4 lbar4 one-loop sigma model, P-5 DP chi_top -> eta/eta', P-6 T_CMB and tree m_W) and diff; verify freeze p
        run: |
          python tools/score_2026_10_02p.py --hub hub --out /tmp/score_p.tsv
          diff -q /tmp/score_p.tsv audit/score_2026-10-02p.tsv
          python tools/verify_freeze_files_p.py
      - name: Re-run the 2026-10-02q scoring (+ late validation) 2026-10-02r scoring (mu_d, chi_top trace) and 2026-10-02s scoring (g_A separation, FKS eta/eta') and diff; verify freezes q, r, s; PHYSICAL_MAP
        run: |
          python tools/score_2026_10_02q.py --hub hub --out /tmp/score_q.tsv
          diff -q /tmp/score_q.tsv audit/score_2026-10-02q.tsv
          python tools/verify_freeze_files_q.py
          python tools/score_2026_10_02q.py --hub hub --late-validation --out /tmp/score_q_late.tsv
          diff -q /tmp/score_q_late.tsv audit/score_2026-10-02q_late.tsv
          python tools/score_2026_10_02r.py --hub hub --out /tmp/score_r.tsv
          diff -q /tmp/score_r.tsv audit/score_2026-10-02r.tsv
          python tools/verify_freeze_files_r.py
          python tools/score_2026_10_02s.py --hub hub --out /tmp/score_s.tsv
          diff -q /tmp/score_s.tsv audit/score_2026-10-02s.tsv
          python tools/verify_freeze_files_s.py
          python tools/score_2026_10_02s2.py --hub hub --out /tmp/score_s2.tsv
          diff -q /tmp/score_s2.tsv audit/score_2026-10-02s2.tsv
          python tools/verify_freeze_files_s2.py
          python tools/score_2026_10_02t.py --hub hub --out /tmp/score_t.tsv
          diff -q /tmp/score_t.tsv audit/score_2026-10-02t.tsv
          python tools/verify_freeze_files_t.py
          python tools/score_2026_10_02u.py --hub hub --out /tmp/score_u.tsv
          diff -q /tmp/score_u.tsv audit/score_2026-10-02u.tsv
          python tools/verify_freeze_files_u.py
          python tools/verify_freeze_files_u2.py
          python tools/score_2026_10_02v.py --hub hub --out /tmp/score_v.tsv
          diff -q /tmp/score_v.tsv audit/score_2026-10-02v.tsv
          python tools/verify_freeze_files_v.py
          python tools/score_2026_10_02w.py --hub hub --out /tmp/score_w.tsv
          diff -q /tmp/score_w.tsv audit/score_2026-10-02w.tsv
          python tools/verify_freeze_files_w.py
          python tools/score_2026_10_02x.py --hub hub --out /tmp/score_x.tsv
          diff -q /tmp/score_x.tsv audit/score_2026-10-02x.tsv
          python tools/verify_freeze_files_x.py
          python tools/score_2026_10_02y.py --hub hub --out /tmp/score_y.tsv
          diff -q /tmp/score_y.tsv audit/score_2026-10-02y.tsv
          python tools/verify_freeze_files_y.py
          python tools/score_2026_10_02z.py --hub hub --out /tmp/score_z.tsv
          diff -q /tmp/score_z.tsv audit/score_2026-10-02z.tsv
          python tools/verify_freeze_files_z.py
          python tools/score_2026_10_02aa.py --hub hub --out /tmp/score_aa.tsv
          diff -q /tmp/score_aa.tsv audit/score_2026-10-02aa.tsv
          python tools/verify_freeze_files_aa.py
          python tools/score_2026_10_02ab.py --hub hub --out /tmp/score_ab.tsv
          diff -q /tmp/score_ab.tsv audit/score_2026-10-02ab.tsv
          python tools/verify_freeze_files_ab.py
          python tools/score_2026_10_02ac.py --hub hub --out /tmp/score_ac.tsv
          diff -q /tmp/score_ac.tsv audit/score_2026-10-02ac.tsv
          python tools/verify_freeze_files_ac.py
          python tools/score_2026_10_02ad.py --hub hub --out /tmp/score_ad.tsv
          diff -q /tmp/score_ad.tsv audit/score_2026-10-02ad.tsv
          python tools/verify_freeze_files_ad.py
          python tools/score_2026_10_02ae.py --hub hub --out /tmp/score_ae.tsv
          diff -q /tmp/score_ae.tsv audit/score_2026-10-02ae.tsv
          python tools/verify_freeze_files_ae.py
          python tools/score_2026_10_02af.py --hub hub --out /tmp/score_af.tsv
          diff -q /tmp/score_af.tsv audit/score_2026-10-02af.tsv
          python tools/verify_freeze_files_af.py
          python tools/score_2026_10_02ag.py --hub hub --out /tmp/score_ag.tsv
          diff -q /tmp/score_ag.tsv audit/score_2026-10-02ag.tsv
          python tools/verify_freeze_files_ag.py
          python tools/score_2026_10_02ah.py --hub hub --out /tmp/score_ah.tsv
          diff -q /tmp/score_ah.tsv audit/score_2026-10-02ah.tsv
          python tools/verify_freeze_files_ah.py
          python tools/score_2026_10_02ai.py --hub hub --out /tmp/score_ai.tsv
          diff -q /tmp/score_ai.tsv audit/score_2026-10-02ai.tsv
          python tools/verify_freeze_files_ai.py
          python tools/score_2026_10_02aj.py --hub hub --out /tmp/score_aj.tsv
          diff -q /tmp/score_aj.tsv audit/score_2026-10-02aj.tsv
          python tools/verify_freeze_files_aj.py
          python tools/score_2026_10_02ak.py --hub hub --out /tmp/score_ak.tsv
          diff -q /tmp/score_ak.tsv audit/score_2026-10-02ak.tsv
          python tools/verify_freeze_files_ak.py
          python tools/score_2026_10_02al.py --hub hub --out /tmp/score_al.tsv
          diff -q /tmp/score_al.tsv audit/score_2026-10-02al.tsv
          python tools/verify_freeze_files_al.py
          python tools/physical_map.py --out /tmp/PHYSICAL_MAP.md
          diff -q /tmp/PHYSICAL_MAP.md docs/PHYSICAL_MAP.md
      - name: Build and run the C++ re-scorer against the golden
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFSOT_HUB_DATA=$PWD/hub
          cmake --build build --target fsot_ledger_b
          ctest --test-dir build -R ledger_b --output-on-failure -j1

  bare-metal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86
      - name: Build the freestanding x86_64 kernel
        run: ./kernel/build.sh build-kernel
      - name: Boot under QEMU and check the 35 ternary domain S values over serial
        run: |
          set +e
          timeout 120 qemu-system-x86_64 -m 64 -kernel build-kernel/fsot_kernel.elf -serial file:serial.txt \
            -display none -no-reboot -monitor none -device isa-debug-exit,iobase=0xf4,iosize=0x04
          code=$?
          set -e
          cat serial.txt
          test "$code" -eq 33
          python3 tools/check_kernel_serial.py serial.txt
